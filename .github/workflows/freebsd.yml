name: freebsd-build-and-test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  freebsd-15:
    name: FreeBSD 15.0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and test on FreeBSD 15.0
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: "15.0"
          mem: 6144
          prepare: |
            pkg install -y tcl86 tk86 pkgconf libXrandr
          run: |
            set -e
            export TCLSH=tclsh8.6
            export TCL_PKGS="tcl86 tk86 x11 xrandr"

            pkg-config --modversion tcl86 tk86 x11 xrandr
            make TCLSH="$TCLSH" TCL_PKGS="$TCL_PKGS"
            make TCLSH="$TCLSH" TCL_PKGS="$TCL_PKGS" test
