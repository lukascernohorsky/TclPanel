name: build-and-test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config tcl-dev tk-dev libx11-dev libxrandr-dev xvfb
      - name: Build X11 extension
        run: make
      - name: Run Tcl smoke tests
        run: make test
      - name: Run XEmbed integration test
        run: make test-tray
      - name: Run X11 window watcher integration test
        run: make test-window-watch
